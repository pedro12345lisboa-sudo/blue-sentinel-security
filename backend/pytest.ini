[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=85
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    live: requires external services (TEST_DATABASE_URL/TEST_REDIS_URL) — enabled in CI
    slow: takes more than a second
