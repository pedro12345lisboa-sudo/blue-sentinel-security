name: release

# Publica as imagens de produção no GHCR quando você pusha uma tag v*:
#   git tag v1.0.0 && git push origin v1.0.0
# Formato: ghcr.io/pedro12345lisboa-sudo/blue-sentinel-{caddy,backend,frontend}:v1.0.0
# (deploy no servidor: ./scripts/deployment/deploy.sh v1.0.0)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-backend:
    name: Gate backend (pytest 85% + regras)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Pytest (cobertura >= 85%)
        run: pytest

      - name: Validação da biblioteca de regras
        run: python ../scripts/development/validate_rules.py

  quality-frontend:
    name: Gate frontend (lint, tipos, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: i18n keys check
        run: pnpm check:i18n

      - name: Unit tests
        run: pnpm test

  build:
    name: Build/push ${{ matrix.app }}
    needs: [quality-backend, quality-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: caddy
            context: docker/caddy
            file: docker/caddy/Dockerfile
          - app: backend
            context: backend
            file: backend/Dockerfile
          - app: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags semver + sha curto)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blue-sentinel-${{ matrix.app }}
          tags: |
            type=ref,event=tag

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
