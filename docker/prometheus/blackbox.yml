# Módulos do blackbox-exporter usados pelo Prometheus.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: [200, 204, 301, 302, 307, 308]

  tls_connect:
    prober: tcp
    timeout: 10s
    tls:
      insecure_skip_verify: false
