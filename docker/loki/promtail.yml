# Promtail: coleta os logs JSON dos contêineres e envia ao Loki.
# Habilitado com o perfil "loki" do docker-compose.observability.yml.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-log.json

    pipeline_stages:
      # Desserializa o JSON do Docker (campo `log` = linha emitida pela app)
      - docker: {}
      # A linha da aplicação também é JSON: indexa nível e logger.
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
      - labels:
          level:
          logger:
