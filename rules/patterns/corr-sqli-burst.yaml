id: corr-sqli-burst
title: Burst of SQL Injection probes against one host
description: >
  Three or more SQL Injection matches (Sigma or YARA) against the same web
  host inside a 120 second window - typically automated scanning or an
  exploitation attempt.
severity: critical
window_seconds: 120
group_by: [host]
stages:
  - id: probes
    min_events: 3
    source:
      rule_ids: [bs-web-sql-injection, Web_SQLi_Access_Log]
mitre: [T1190]
false_positives:
  - Authorised vulnerability scanners or a WAF test campaign
response:
  - Block the source IP at the reverse proxy / WAF
  - Review application logs for the same parameter in the window
  - Confirm whether any request returned database content
