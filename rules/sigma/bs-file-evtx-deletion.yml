title: Windows Event Log File Deleted
id: bs-file-evtx-deletion
status: experimental
description: >
  An .evtx event log file was deleted. Attackers remove log files after
  clearing them to cover their tracks. Synthetic lab rule - matches only
  fabricated BLUE-SENTINEL lab events.
author: Blue Sentinel
date: 2024/06/01
references:
  - https://attack.mitre.org/techniques/T1070/002/
logsource:
  product: windows
  category: file_event
detection:
  selection:
    category: file
    action: file_delete
    path|endswith|i: '.evtx'
    product: windows
  condition: selection
level: high
falsepositives:
  - Backup or migration tools archiving old event logs
  - Log collection utilities that rotate evtx files
response:
  - Recover the evtx from volume shadow copies if available
  - Correlate with Event 1102 and process creation on the same host
  - Move log collection off the endpoint while investigating
tags:
  - attack.t1070_004
lab_samples:
  match:
    - timestamp: '2024-04-02T22:41:05Z'
      category: file
      action: file_delete
      event_id: '23'
      host: SRV-DEMO-02
      user: admin.demo
      ip: 198.51.100.20
      product: windows
      process: cmd.exe
      path: C:\Windows\System32\winevt\Logs\Security.evtx
  no_match:
    - timestamp: '2024-04-02T22:41:40Z'
      category: file
      action: file_delete
      event_id: '23'
      host: SRV-DEMO-02
      user: admin.demo
      ip: 198.51.100.20
      product: windows
      process: cmd.exe
      path: C:\Temp\debug.log
