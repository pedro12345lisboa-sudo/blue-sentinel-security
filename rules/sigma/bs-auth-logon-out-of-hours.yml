title: Successful Logon Outside Working Hours from a New Source
id: bs-auth-logon-out-of-hours
status: experimental
description: >
  A successful interactive logon between 00:00 and 04:59 UTC from a source
  never seen before for this account. Synthetic lab rule - matches only
  fabricated BLUE-SENTINEL lab events.
author: Blue Sentinel
date: 2024/06/01
references:
  - https://attack.mitre.org/techniques/T1078/
logsource:
  product: windows
  service: security
  category: authentication_success
detection:
  selection:
    category: auth
    action: logon
    event_id: '4624'
    new_source: true
    hour|gte: 0
    hour|lte: 4
  condition: selection
level: high
falsepositives:
  - Administrators performing authorised night maintenance
  - Users travelling across time zones
  - Backup or batch jobs that authenticate interactively by mistake
response:
  - Verify the account owner and the source IP/country
  - Reset the credential if the logon was not expected
  - Review the commands executed in the session that followed
tags:
  - attack.t1078
  - attack.t1003
lab_samples:
  match:
    - timestamp: '2024-01-10T03:14:10Z'
      category: auth
      action: logon
      event_id: '4624'
      host: SRV-DEMO-02
      user: admin.demo
      ip: 203.0.113.90
      product: windows
      new_source: true
      country: SG
      message: An account was successfully logged on.
  no_match:
    - timestamp: '2024-01-10T15:00:00Z'
      category: auth
      action: logon
      event_id: '4624'
      host: SRV-DEMO-02
      user: admin.demo
      ip: 203.0.113.90
      product: windows
      new_source: true
      country: SG
      message: An account was successfully logged on.
