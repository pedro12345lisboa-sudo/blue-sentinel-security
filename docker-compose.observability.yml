# Perfil opcional de observabilidade: Prometheus + Alertmanager + Grafana +
# blackbox-exporter (+ Loki/Promtail com o perfil "loki").
#
# Uso (sempre junto com o compose base):
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability up -d
#
#   # com coleta de logs (Loki + Promtail):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability --profile loki up -d
#
# Grafana: http://localhost:3001 (admin / grafana — troque via GRAFANA_ADMIN_PASSWORD)
# Prometheus: http://localhost:9090
# Detalhes e testes de alerta: docs/architecture/observability.md

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: blue-sentinel-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./docker/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - alertmanager
    networks:
      - backend-net
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: blue-sentinel-alertmanager
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./docker/prometheus/alert_webhook_token:/etc/alertmanager/webhook_token:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blue-sentinel-blackbox
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./docker/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - backend-net
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "64M"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: blue-sentinel-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # --- Logs estruturados em Loki (opcional) -------------------------------
  # Os logs do backend já são JSON (campo `level`, `request_id`, `route`...).
  loki:
    image: grafana/loki:3.1.1
    container_name: blue-sentinel-loki
    profiles: ["loki"]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - backend-net

  promtail:
    image: grafana/promtail:3.1.1
    container_name: blue-sentinel-promtail
    profiles: ["loki"]
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./docker/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - backend-net

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
